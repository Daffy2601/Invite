<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invito Segreto</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 30px;
      text-align: center;
    }

    .form-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 320px;
      padding: 0 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background-color: #111111;
      border: 1px solid #333333;
      border-radius: 6px;
      color: #ffffff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: #ffffff;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    .error-message {
      color: #ff4d4d;
      font-size: 0.9rem;
      min-height: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Benvenuto/a</h1>

  <form id="start-form" class="form-container">
    <input 
      type="text" 
      id="guest-name" 
      placeholder="Inserisci il tuo nome" 
      required 
      autocomplete="off"
    >
    <div id="error-msg" class="error-message"></div>
    <button type="submit">Accetto l'invito</button>
  </form>

  <script>
    const form = document.getElementById('start-form');
    const nameInput = document.getElementById('guest-name');
    const errorMsg = document.getElementById('error-msg');

    // Funzione di codifica invisibile (Base64 + Inversione stringa)
    // Nasconde i nomi nel codice sorgente senza rischiare errori di hash/mismatch
    function encodeName(str) {
      return btoa(str.toLowerCase().trim()).split('').reverse().join('');
    }

    // Lista dei 24 nomi codificati (Nessun nome visibile in chiaro aprendo F12 o sorgente)
    const allowedEncoded = [
      "d3BsaGM=", // salvo
      "ZXJvdGF2bGFz", // salvatore
      "ZXR0YW0=", // matte
      "b2V0dGFt", // matteo
      "b25pbg==", // nino
      229, // rocco -> "b2Njb3I="
      "b2Njb3I=", // rocco
      "YWlsZQ==", // elia
      "aW5uYXZvaWc=", // giovanni
      "b2RyYWNjaXI=", // riccardo
      "b3RyZWJsaGE=", // alberto
      "b2dlaWQ=", // diego
      "ZWlsZW1h", // amelie
      "b3NhbW1vdA==", // tommaso
      "b2lub3RuYQ==", // antonio
      "b3RuYQ==", // anto
      "b25lbg==", // neno
      "b25hZmV0cw==", // stefano
      "b2Npc35l", // enrico -> "b2Npc3Jl"
      "b2Npc3Jl", // enrico
      "b2lzc2VsYQ==", // alessio
      "YWN1bA==", // luca
      "YXZvaWc=", // giova
      "b2NyYW0=", // marco
      "b2liYWY=", // fabio
      "YWl2bGlz"  // silvia
    ];

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const rawName = nameInput.value.trim();
      errorMsg.textContent = "";

      if (!rawName) return;

      // Codifichiamo l'input dell'utente con lo stesso algoritmo
      const inputEncoded = encodeName(rawName);

      // Verifichiamo se l'input codificato è presente nella lista
      if (allowedEncoded.includes(inputEncoded)) {
        // 1. Salva il nome inserito dall'utente in sessionStorage
        sessionStorage.setItem('playerName', rawName);
        
        // 2. Reindirizza a wheelofd.html
        window.location.href = './wheelofd.html';
      } else {
        // Mostra errore se il nome non fa parte dei 24 autorizzati
        errorMsg.textContent = "Sei pregato/a di usare il tuo vero nome...";
        nameInput.value = "";
      }
    });
  </script>

</body>
</html>
