<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invito Segreto</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 30px;
      text-align: center;
    }

    .form-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 320px;
      padding: 0 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background-color: #111111;
      border: 1px solid #333333;
      border-radius: 6px;
      color: #ffffff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: #ffffff;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    .error-message {
      color: #ff4d4d;
      font-size: 0.9rem;
      min-height: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Benvenuto/a</h1>

  <form id="start-form" class="form-container">
    <input 
      type="text" 
      id="guest-name" 
      placeholder="Inserisci il tuo nome" 
      required 
      autocomplete="off"
    >
    <div id="error-msg" class="error-message"></div>
    <button type="submit">Accetto l'invito</button>
  </form>

  <script>
    const form = document.getElementById('start-form');
    const nameInput = document.getElementById('guest-name');
    const errorMsg = document.getElementById('error-msg');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const rawName = nameInput.value.trim();
      
      if (rawName) {
        // 1. Salva il nome inserito nella sessionStorage del browser
        sessionStorage.setItem('playerName', rawName);
        
        // 2. Reindirizza l'utente alla pagina della ruota
        window.location.href = './wheelofd.html';
      } else {
        errorMsg.textContent = "Inserisci un nome valido per proseguire.";
      }
    });
  </script>

</body>
</html>
