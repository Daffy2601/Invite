<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wheel of D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      user-select: none;
      -webkit-user-select: none;
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 2px;
    }

    .status-bar {
      font-size: 0.95rem;
      color: #aaaaaa;
      margin-top: 5px;
    }

    .game-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .wheel-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
    }

    .wheel-zone {
      position: relative;
      width: 90vw;
      max-width: 440px;
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto;
    }

    .alignment-marker {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 15px solid #ffffff;
      z-index: 20;
      pointer-events: none;
    }

    .wheel-ring {
      position: absolute;
      border-radius: 50%;
      cursor: grab;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: border-color 0.3s ease, transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      touch-action: none;
      overflow: hidden;
    }

    .wheel-ring.dragging {
      cursor: grabbing;
      transition: border-color 0.2s ease;
    }

    .ring-outer {
      width: 100%;
      height: 100%;
      border: 3px solid #333333;
      z-index: 1;
    }
    
    .ring-middle {
      width: 68%;
      height: 68%;
      border: 3px solid #555555;
      z-index: 2;
    }

    .ring-inner {
      width: 36%;
      height: 36%;
      border: 3px solid #888888;
      z-index: 3;
    }

    .ring-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: contain;
      pointer-events: none;
      display: block;
    }

    .symbol-feedback {
      margin-top: 15px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #00ff88;
      min-height: 28px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
      transform: translateY(10px);
    }

    .symbol-feedback.show {
      opacity: 1;
      transform: translateY(0);
    }

    .grid-zone {
      width: 90vw;
      max-width: 440px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      aspect-ratio: 1 / 1;
      background-color: #111111;
      padding: 6px;
      border: 2px solid #333333;
      border-radius: 8px;
    }

    .grid-tile {
      background-color: #0a0a0a;
      border: 1px dashed #222222;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: box-shadow 0.4s ease, border-color 0.4s ease;
    }

    .grid-tile span {
      color: #333333;
      font-size: 1rem;
      font-weight: bold;
    }

    .grid-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .grid-tile.unlocked img {
      opacity: 1;
      transform: scale(1);
    }

    .grid-tile.unlocked {
      border: none;
    }

    @keyframes tileGlow {
      0% {
        box-shadow: 0 0 0px #00ff88;
        border: 2px solid #00ff88;
      }
      50% {
        box-shadow: 0 0 25px #00ff88;
        border: 2px solid #00ff88;
      }
      100% {
        box-shadow: 0 0 0px transparent;
        border: none;
      }
    }

    .grid-tile.flash-unlock {
      animation: tileGlow 1.8s ease-out forwards;
    }

    .success-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      padding: 20px;
      text-align: center;
    }

    .success-modal.show {
      opacity: 1;
      pointer-events: auto;
    }

    .success-modal h2 {
      font-size: 2rem;
      color: #00ff88;
      margin-bottom: 15px;
    }

    @media (min-width: 768px) {
      .game-container {
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 60px;
        padding-top: 30px;
      }

      .wheel-zone, .grid-zone {
        width: 100%;
        max-width: 480px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1 id="player-title">Wheel of D</h1>
    <div class="status-bar">Simbolo <span id="current-stage">1</span> / 9 completati</div>
  </header>

  <main class="game-container">
    
    <div class="wheel-column">
      <section class="wheel-zone" id="wheel-container">
        <div class="alignment-marker"></div>

        <div class="wheel-ring ring-outer" id="ring-outer">
          <img src="outer.png" alt="Anello Esterno" class="ring-img">
        </div>

        <div class="wheel-ring ring-middle" id="ring-middle">
          <img src="middle.png" alt="Anello Intermedio" class="ring-img">
        </div>

        <div class="wheel-ring ring-inner" id="ring-inner">
          <img src="inner.png" alt="Anello Interno" class="ring-img">
        </div>
      </section>

      <div id="symbol-feedback" class="symbol-feedback"></div>
    </div>

    <section class="grid-zone">
      <div class="grid-tile" id="tile-0"><span>1</span><img src="qr1.jpeg" alt="QR 1"></div>
      <div class="grid-tile" id="tile-1"><span>2</span><img src="qr2.jpeg" alt="QR 2"></div>
      <div class="grid-tile" id="tile-2"><span>3</span><img src="qr3.jpeg" alt="QR 3"></div>
      <div class="grid-tile" id="tile-3"><span>4</span><img src="qr4.jpeg" alt="QR 4"></div>
      <div class="grid-tile" id="tile-4"><span>5</span><img src="qr5.jpeg" alt="QR 5"></div>
      <div class="grid-tile" id="tile-5"><span>6</span><img src="qr6.jpeg" alt="QR 6"></div>
      <div class="grid-tile" id="tile-6"><span>7</span><img src="qr7.jpeg" alt="QR 7"></div>
      <div class="grid-tile" id="tile-7"><span>8</span><img src="qr8.jpeg" alt="QR 8"></div>
      <div class="grid-tile" id="tile-8"><span>9</span><img src="qr9.jpeg" alt="QR 9"></div>
    </section>

  </main>

  <div class="success-modal" id="success-modal">
    <h2>QR Code Completato!</h2>
    <p>Hai allineato tutti e 9 i simboli con successo.</p>
  </div>

  <script>
    const playerName = sessionStorage.getItem('playerName') || 'Giocatore';
    document.getElementById('player-title').textContent = `Wheel of D - ${playerName}`;

    const targetAngles = [
      { outer: 93.453,  middle: 0.310757, inner: 666 },
      { outer: 0,       middle: 176.602,  inner: 336.852 },
      { outer: 95.2604, middle: 220.739,  inner: 72.4342 },
      { outer: 260.7,   middle: 2.43437,  inner: 666 },
      { outer: 0,       middle: 176.602,  inner: 336.852 },
      { outer: 310.957, middle: 40.0678,  inner: 666 },
      { outer: 666,     middle: 3.67103,   inner: 245.087 },
      { outer: 0,       middle: 176.602,  inner: 336.852 },
      { outer: 174.682, middle: 0.310757, inner: 666 }
    ];

    let currentStage = 0;
    const snapTolerance = 1;
    let isLockedForAnimation = false;
    let pauseTimer = null;

    let ringsState = {
      outer: 0,
      middle: 0,
      inner: 0
    };

    const STORAGE_KEY = `wheelOfD_save_${playerName.toLowerCase()}`;

    function saveProgress() {
      const saveData = {
        currentStage: currentStage,
        ringsState: ringsState
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData));
    }

    function loadProgress() {
      const rawSave = localStorage.getItem(STORAGE_KEY);
      if (rawSave) {
        try {
          const saveData = JSON.parse(rawSave);
          currentStage = saveData.currentStage || 0;
          ringsState = saveData.ringsState || { outer: 0, middle: 0, inner: 0 };

          for (let i = 0; i < currentStage; i++) {
            const tileEl = document.getElementById(`tile-${i}`);
            if (tileEl) tileEl.classList.add('unlocked');
          }

          document.getElementById('current-stage').textContent = Math.min(currentStage + 1, 9);

          document.getElementById('ring-outer').style.transform = `rotate(${ringsState.outer}deg)`;
          document.getElementById('ring-middle').style.transform = `rotate(${ringsState.middle}deg)`;
          document.getElementById('ring-inner').style.transform = `rotate(${ringsState.inner}deg)`;

          if (currentStage >= 9) {
            document.getElementById('success-modal').classList.add('show');
          }
        } catch (e) {
          console.error("Errore caricamento progressi:", e);
        }
      }
    }

    function normalizeAngle(angle) {
      let a = angle % 360;
      return a < 0 ? a + 360 : a;
    }

    function angleDiff(a, b) {
      let diff = Math.abs(normalizeAngle(a) - normalizeAngle(b));
      return diff > 180 ? 360 - diff : diff;
    }

    // Verifica la fase relativa tra i cerchi attivi e restituisce i target angolari assoluti per lo snap
    function checkRelativeAlignment() {
      if (currentStage >= 9) return null;

      const target = targetAngles[currentStage];
      const activeKeys = ['outer', 'middle', 'inner'].filter(k => target[k] !== 666);

      if (activeKeys.length === 0) return null;

      // Se c'è solo un cerchio attivo per il simbolo
      if (activeKeys.length === 1) {
        const key = activeKeys[0];
        if (angleDiff(ringsState[key], target[key]) <= snapTolerance) {
          let nextState = { ...ringsState };
          nextState[key] = normalizeAngle(target[key]);
          return nextState;
        }
        return null;
      }

      // Se ci sono più cerchi attivi: controlliamo se le relative differenze rispecchiano la combinazione target
      const baseKey = activeKeys[0];
      const userBaseAngle = ringsState[baseKey];
      const targetBaseAngle = target[baseKey];
      const rotationOffset = userBaseAngle - targetBaseAngle;

      let isRelativeMatch = true;

      for (let i = 1; i < activeKeys.length; i++) {
        const key = activeKeys[i];
        const expectedAngle = normalizeAngle(target[key] + rotationOffset);
        if (angleDiff(ringsState[key], expectedAngle) > snapTolerance) {
          isRelativeMatch = false;
          break;
        }
      }

      // Se il simbolo è allineato (anche a +90° o in un'altra direzione), forziamo lo snap agli angoli target definiti
      if (isRelativeMatch) {
        let snapState = { ...ringsState };
        activeKeys.forEach(k => {
          snapState[k] = normalizeAngle(target[k]);
        });
        return snapState;
      }

      return null;
    }

    function scheduleAlignmentCheck() {
      if (pauseTimer) clearTimeout(pauseTimer);
      if (isLockedForAnimation || currentStage >= 9) return;

      pauseTimer = setTimeout(() => {
        const snapAngles = checkRelativeAlignment();
        if (snapAngles) {
          triggerUnlockSequence(snapAngles);
        }
      }, 1000);
    }

    function setupRingRotation(ringId, ringKey) {
      const ringEl = document.getElementById(ringId);
      let isDragging = false;
      let startAngle = 0;
      let initialRotation = 0;

      function getAngle(clientX, clientY) {
        const rect = ringEl.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const radians = Math.atan2(clientY - centerY, clientX - centerX);
        let degrees = radians * (180 / Math.PI);
        return degrees < 0 ? degrees + 360 : degrees;
      }

      function onStart(e) {
        if (currentStage >= 9 || isLockedForAnimation) return;
        isDragging = true;
        ringEl.classList.add('dragging');
        
        if (pauseTimer) clearTimeout(pauseTimer);

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        startAngle = getAngle(clientX, clientY);
        initialRotation = ringsState[ringKey];
        e.preventDefault();
      }

      function onMove(e) {
        if (!isDragging || isLockedForAnimation) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const currentAngle = getAngle(clientX, clientY);
        let delta = currentAngle - startAngle;

        let newRotation = normalizeAngle(initialRotation + delta);

        ringsState[ringKey] = newRotation;
        ringEl.style.transform = `rotate(${newRotation}deg)`;

        scheduleAlignmentCheck();
      }

      function onEnd() {
        if (!isDragging) return;
        isDragging = false;
        ringEl.classList.remove('dragging');

        saveProgress();
        scheduleAlignmentCheck();
      }

      ringEl.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);

      ringEl.addEventListener('touchstart', onStart, { passive: false });
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onEnd);
    }

    function triggerUnlockSequence(snapAngles) {
      isLockedForAnimation = true;

      // 1. Snap dolce sui cerchi attivi portandoli agli angoli target corretti per quel simbolo
      ringsState = snapAngles;
      document.getElementById('ring-outer').style.transform = `rotate(${ringsState.outer}deg)`;
      document.getElementById('ring-middle').style.transform = `rotate(${ringsState.middle}deg)`;
      document.getElementById('ring-inner').style.transform = `rotate(${ringsState.inner}deg)`;

      // 2. Feedback bordi verdi
      document.querySelectorAll('.wheel-ring').forEach(r => r.style.borderColor = '#00ff88');

      // 3. Testo simbolo sbloccato
      const feedbackEl = document.getElementById('symbol-feedback');
      const completedSymbolNumber = currentStage + 1;
      feedbackEl.textContent = `✦ Simbolo ${completedSymbolNumber} Allineato! ✦`;
      feedbackEl.classList.add('show');

      // 4. Mostra il pezzo di QR code nella griglia 3x3
      const tileEl = document.getElementById(`tile-${currentStage}`);
      if (tileEl) {
        tileEl.classList.add('unlocked', 'flash-unlock');
      }

      currentStage++;
      document.getElementById('current-stage').textContent = Math.min(currentStage + 1, 9);
      saveProgress();

      // Reset dopo 2 secondi
      setTimeout(() => {
        document.getElementById('ring-outer').style.borderColor = '#333333';
        document.getElementById('ring-middle').style.borderColor = '#555555';
        document.getElementById('ring-inner').style.borderColor = '#888888';
        
        feedbackEl.classList.remove('show');
        if (tileEl) tileEl.classList.remove('flash-unlock');

        isLockedForAnimation = false;

        if (currentStage >= 9) {
          setTimeout(() => {
            document.getElementById('success-modal').classList.add('show');
          }, 400);
        }
      }, 2000);
    }

    setupRingRotation('ring-outer', 'outer');
    setupRingRotation('ring-middle', 'middle');
    setupRingRotation('ring-inner', 'inner');

    loadProgress();
  </script>

</body>
</html>
