<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Test preliminare per l'accesso</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      user-select: none;
      -webkit-user-select: none;
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 2px;
    }

    .status-bar {
      font-size: 0.95rem;
      color: #aaaaaa;
      margin-top: 5px;
    }

    .game-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .wheel-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
    }

    .wheel-zone {
      position: relative;
      width: 90vw;
      max-width: 440px;
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto;
    }

    .alignment-marker {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 15px solid #ffffff;
      z-index: 20;
      pointer-events: none;
    }

    .wheel-ring {
      position: absolute;
      border-radius: 50%;
      cursor: grab;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: border-color 0.3s ease, transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      touch-action: none;
      overflow: hidden;
    }

    .wheel-ring.dragging {
      cursor: grabbing;
      transition: border-color 0.2s ease;
    }

    .ring-outer {
      width: 100%;
      height: 100%;
      border: 3px solid #333333;
      z-index: 1;
    }
    
    .ring-middle {
      width: 68%;
      height: 68%;
      border: 3px solid #555555;
      z-index: 2;
    }

    .ring-inner {
      width: 36%;
      height: 36%;
      border: 3px solid #888888;
      z-index: 3;
    }

    .ring-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: contain;
      pointer-events: none;
      display: block;
    }

    .symbol-feedback {
      margin-top: 15px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #00ff88;
      min-height: 28px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
      transform: translateY(10px);
    }

    .symbol-feedback.show {
      opacity: 1;
      transform: translateY(0);
    }

    .grid-zone {
      width: 90vw;
      max-width: 440px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      aspect-ratio: 1 / 1;
      background-color: #111111;
      padding: 6px;
      border: 2px solid #333333;
      border-radius: 8px;
      transition: gap 0.5s ease, padding 0.5s ease, border-color 0.5s ease, background-color 0.5s ease;
    }

    .grid-tile {
      background-color: #0a0a0a;
      border: 1px dashed #222222;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: box-shadow 0.4s ease, border-color 0.4s ease, border-radius 0.5s ease;
    }

    .grid-tile span {
      color: #333333;
      font-size: 1rem;
      font-weight: bold;
    }

    .grid-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .grid-tile.unlocked img {
      opacity: 1;
      transform: scale(1);
    }

    .grid-tile.unlocked {
      border: none;
    }

    .grid-zone.completed {
      gap: 0;
      padding: 0;
      border: none;
      background-color: transparent;
    }

    .grid-zone.completed .grid-tile {
      border: none;
      border-radius: 0;
      background-color: transparent;
    }

    @keyframes tileGlow {
      0% {
        box-shadow: 0 0 0px #00ff88;
        border: 2px solid #00ff88;
      }
      50% {
        box-shadow: 0 0 25px #00ff88;
        border: 2px solid #00ff88;
      }
      100% {
        box-shadow: 0 0 0px transparent;
        border: none;
      }
    }

    .grid-tile.flash-unlock {
      animation: tileGlow 1.8s ease-out forwards;
    }

    .final-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      padding: 25px;
      text-align: center;
    }

    .final-modal.show {
      opacity: 1;
      pointer-events: auto;
    }

    .final-modal-content {
      position: relative;
      background-color: #111111;
      border: 1px solid #333333;
      border-radius: 12px;
      padding: 35px 25px 25px 25px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
      animation: modalPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalPop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: transparent;
      border: none;
      color: #aaaaaa;
      font-size: 1.6rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .close-btn:hover {
      color: #00ff88;
    }

    .final-modal h2 {
      font-size: 1.8rem;
      color: #00ff88;
      margin-bottom: 15px;
      font-weight: 400;
      letter-spacing: 1px;
    }

    .final-modal p {
      font-size: 1.05rem;
      line-height: 1.5;
      color: #dddddd;
      white-space: pre-line;
      margin-bottom: 25px;
    }

    .modal-action-btn {
      background-color: #ffffff;
      color: #000000;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .modal-action-btn:hover {
      background-color: #00ff88;
    }

    .reopen-msg-btn {
      display: none;
      margin-top: 15px;
      background: transparent;
      border: 1px solid #333333;
      color: #aaaaaa;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .reopen-msg-btn.show {
      display: inline-block;
    }

    .reopen-msg-btn:hover {
      border-color: #00ff88;
      color: #00ff88;
    }

    @media (min-width: 768px) {
      .game-container {
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 60px;
        padding-top: 30px;
      }

      .wheel-zone, .grid-zone {
        width: 100%;
        max-width: 480px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1 id="player-title">Consideralo un test di ingresso</h1>
    <h2 id="current-stage">In totale ci sono 8 simboli da trovare</h2>
  </header>

  <main class="game-container">
    
    <div class="wheel-column">
      <section class="wheel-zone" id="wheel-container">
        <div class="alignment-marker"></div>

        <div class="wheel-ring ring-outer" id="ring-outer">
          <img src="outer.png" alt="Anello Esterno" class="ring-img">
        </div>

        <div class="wheel-ring ring-middle" id="ring-middle">
          <img src="middle.png" alt="Anello Intermedio" class="ring-img">
        </div>

        <div class="wheel-ring ring-inner" id="ring-inner">
          <img src="inner.png" alt="Anello Interno" class="ring-img">
        </div>
      </section>

      <div id="symbol-feedback" class="symbol-feedback"></div>
      <button id="reopen-msg-btn" class="reopen-msg-btn">Rileggi il tuo messaggio</button>
    </div>

    <section class="grid-zone" id="grid-zone">
      <div class="grid-tile" id="tile-0"><span>1</span><img src="qr1.jpeg" alt="QR 1"></div>
      <div class="grid-tile" id="tile-1"><span>2</span><img src="qr2.jpeg" alt="QR 2"></div>
      <div class="grid-tile" id="tile-2"><span>3</span><img src="qr3.jpeg" alt="QR 3"></div>
      <div class="grid-tile" id="tile-3"><span>4</span><img src="qr4.jpeg" alt="QR 4"></div>
      <div class="grid-tile" id="tile-4"><span>5</span><img src="qr5.jpeg" alt="QR 5"></div>
      <div class="grid-tile" id="tile-5"><span>6</span><img src="qr6.jpeg" alt="QR 6"></div>
      <div class="grid-tile" id="tile-6"><span>7</span><img src="qr7.jpeg" alt="QR 7"></div>
      <div class="grid-tile" id="tile-7"><span>8</span><img src="qr8.jpeg" alt="QR 8"></div>
      <div class="grid-tile" id="tile-8"><span>9</span><img src="qr9.jpeg" alt="QR 9"></div>
    </section>

  </main>

  <div class="final-modal" id="final-modal">
    <div class="final-modal-content">
      <button class="close-btn" id="close-modal-x">&times;</button>
      <h2 id="final-modal-title">Complimenti!</h2>
      <p id="final-modal-message"></p>
      <button class="modal-action-btn" id="close-modal-btn">Chiudi e vedi QR</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const userPrime = parseInt(urlParams.get('user'), 10);

    const primeMessages = {
      3: "Sasà, Sal0089, ce l'abbiamo fatta, siamo arrivati e ora non ti resta che entrare",
      13: "Ué Matté agg scassat o cazz, però sei stato bravo, bravo cucciolotto, ora entra",
      23: "Bravo NiNuzzo, beddu figghiu miu, ora entra",
      43: "Signore dell'inganno, non si è fatto ingannare da tutto ciò, le è concesso l'accesso",
      53: "Signor G, BEH!? Pensavi sarebbe stato più difficile? Quando entri non esordire con un frociosculo possibilmente",
      73: "Bravo Ricky Montanane, ora puoi entrare col QR Code, ti aspettiamo Richard Mountainbike",
      83: "Albuuuuuuuuuu, entra dai ricchionazzo bastardo",
      103: "Da grandi ruote da girare derivano grandi gruppi in cui entrare, muovi il culo Diego",
      113: "Brava Amebella, so che a Campotto tecnologie così non ne avete, temevo ti tirassi indietro",
      163: "Tommy Immommy, quando compare un QR code queste persone gentili e per bene, si sbranano il pene",
      173: "Antotna, scansiona il QR bidone che non sei altro, Bidonanto",
      193: "Daje Neno, non penso ti dispiacerà se per una sera ti distraggo dai tuoi pomodori o dallo studio di mazzette IV",
      223: "Lo Scassone, cosa fai non entri? Sarai felice di sapere che c'è anche Babbuz Nataluz",
      233: "Dai Bimba, ci hai messo anche troppo per sto giochino ora entra nel gruppo, babbuz di minchiaz",
      263: "Sugar, non penso tu ne abbia mai fatti di questi a meccanica, quindi direi che per essere la tua prima volta non te la sei cavata male",
      283: "Complimenti vicino, ora puoi entrare nel gruppo scansionando il codice",
      293: "Polissimo, dottore, esimio, collega (alla lontana), scansioni il codice QR ADESSO e non perda altro tempo",
      313: "D'altronde... Bonga Tonga e si sa... Banga Tanga, ora scansiona il codice, muvat"
    };

    if (!userPrime || !primeMessages.hasOwnProperty(userPrime)) {
      window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('final-modal-title').textContent = "Alt!";
        document.getElementById('final-modal-title').style.color = "#ff4d4d";
        document.getElementById('final-modal-message').textContent = "Fai il ficcanaso? Smettila subito";
        
        const closeBtnX = document.getElementById('close-modal-x');
        const closeBtn = document.getElementById('close-modal-btn');
        
        closeBtn.textContent = "Torna all'ingresso";
        
        const redirectToIndex = () => { window.location.href = './index.html'; };
        closeBtnX.addEventListener('click', redirectToIndex);
        closeBtn.addEventListener('click', redirectToIndex);
        
        document.getElementById('final-modal').classList.add('show');
      });
    }

    const playerName = sessionStorage.getItem('playerName') || 'Giocatore';

    const symbolDescriptions = [
      "Saturno", //1
      "Una barca sotto sopra", //2
      "Il grande, carro", //3
      "L'occhio di Horus", //4
      "Una E un po' particolare, chi sa sa...", //5
      "Una piuma", //6
      "Sotto sopra, un indizio per un altro simbolo", //7
      "Scontato" //8
    ];

    const targetAngles = [
      { outer: 93.453,  middle: 0.310757, inner: 666 }, //1
      { outer: 0,       middle: 176.602,  inner: 336.852 }, //2
      { outer: 95.2604, middle: 220.739,  inner: 72.4342 }, //3
      { outer: 666,     middle: 3.67103,   inner: 245.087 }, //4
      { outer: 310.957, middle: 40.0678,  inner: 666 }, //5
      { outer: 344.821, middle: 19.0264,  inner: 666 }, //6
      { outer: 260.7,   middle: 2.43437,  inner: 666 }, //7
      { outer: 174.682, middle: 0.310757, inner: 666 } //8
    ];

    const snapTolerance = 3;
    let isLockedForAnimation = false;
    let pauseTimer = null;

    let unlockedTiles = [false, false, false, false, false, false, false, false, false];

    let ringsState = {
      outer: 90,
      middle: 0,
      inner: 0
    };

    const STORAGE_KEY = `wheelOfD_save_${playerName.toLowerCase()}`;

    function saveProgress() {
      const saveData = {
        unlockedTiles: unlockedTiles,
        ringsState: ringsState
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData));
    }

    function closeModal() {
      document.getElementById('final-modal').classList.remove('show');
    }

    function openModal() {
      document.getElementById('final-modal').classList.add('show');
    }

    document.getElementById('close-modal-x').addEventListener('click', closeModal);
    document.getElementById('close-modal-btn').addEventListener('click', closeModal);
    document.getElementById('reopen-msg-btn').addEventListener('click', openModal);

    function checkCompletionState() {
      if (unlockedTiles.every(t => t === true)) {
        document.getElementById('grid-zone').classList.add('completed');
        document.getElementById('reopen-msg-btn').classList.add('show');

        const customMessage = primeMessages[userPrime] || "Complimenti! Hai ricomposto il codice segreto.";

        document.getElementById('final-modal-title').style.color = "#00ff88";
        document.getElementById('final-modal-title').textContent = "Complimenti!";
        document.getElementById('final-modal-message').textContent = customMessage;

        setTimeout(() => {
          openModal();
        }, 1200);
      }
    }

    function loadProgress() {
      const rawSave = localStorage.getItem(STORAGE_KEY);
      if (rawSave) {
        try {
          const saveData = JSON.parse(rawSave);
          unlockedTiles = saveData.unlockedTiles || [false, false, false, false, false, false, false, false, false];
          ringsState = saveData.ringsState || { outer: 90, middle: 0, inner: 0 };

          let count = 0;
          unlockedTiles.forEach((isUnlocked, index) => {
            if (isUnlocked) {
              const tileEl = document.getElementById(`tile-${index}`);
              if (tileEl) tileEl.classList.add('unlocked');
              count++;
            }
          });

          document.getElementById('current-stage').textContent = count;
        } catch (e) {
          console.error("Errore caricamento progressi:", e);
        }
      }

      document.getElementById('ring-outer').style.transform = `rotate(${ringsState.outer}deg)`;
      document.getElementById('ring-middle').style.transform = `rotate(${ringsState.middle}deg)`;
      document.getElementById('ring-inner').style.transform = `rotate(${ringsState.inner}deg)`;

      checkCompletionState();
    }

    function normalizeAngle(angle) {
      let a = angle % 360;
      return a < 0 ? a + 360 : a;
    }

    function angleDiff(a, b) {
      let diff = Math.abs(normalizeAngle(a) - normalizeAngle(b));
      return diff > 180 ? 360 - diff : diff;
    }

    function getTilesForCombo(comboIdx) {
      if (comboIdx === 1) {
        return [1, 4];
      } else if (comboIdx > 1) {
        const map = { 2: 2, 3: 3, 4: 5, 5: 6, 6: 7, 7: 8 };
        return [map[comboIdx]];
      }
      return [0];
    }

    function checkRelativeAlignment() {
      if (unlockedTiles.every(t => t === true)) return null;

      for (let comboIdx = 0; comboIdx < targetAngles.length; comboIdx++) {
        const associatedTiles = getTilesForCombo(comboIdx);
        
        if (associatedTiles.every(tIdx => unlockedTiles[tIdx])) continue;

        const target = targetAngles[comboIdx];
        const activeKeys = ['outer', 'middle', 'inner'].filter(k => target[k] !== 666);

        if (activeKeys.length === 0) continue;

        let isMatch = false;

        if (activeKeys.length === 1) {
          const key = activeKeys[0];
          if (angleDiff(ringsState[key], target[key]) <= snapTolerance) {
            isMatch = true;
          }
        } else {
          const baseKey = activeKeys[0];
          const userBaseAngle = ringsState[baseKey];
          const targetBaseAngle = target[baseKey];
          const rotationOffset = userBaseAngle - targetBaseAngle;

          let isRelativeMatch = true;
          for (let i = 1; i < activeKeys.length; i++) {
            const key = activeKeys[i];
            const expectedAngle = normalizeAngle(target[key] + rotationOffset);
            if (angleDiff(ringsState[key], expectedAngle) > snapTolerance) {
              isRelativeMatch = false;
              break;
            }
          }
          if (isRelativeMatch) isMatch = true;
        }

        if (isMatch) {
          let snapState = { ...ringsState };
          activeKeys.forEach(k => {
            snapState[k] = normalizeAngle(target[k]);
          });
          return { comboIdx: comboIdx, snapAngles: snapState };
        }
      }

      return null;
    }

    function scheduleAlignmentCheck() {
      if (pauseTimer) clearTimeout(pauseTimer);
      if (isLockedForAnimation || unlockedTiles.every(t => t === true)) return;

      pauseTimer = setTimeout(() => {
        const result = checkRelativeAlignment();
        if (result) {
          triggerUnlockSequence(result.comboIdx, result.snapAngles);
        }
      }, 1000);
    }

    function setupRingRotation(ringId, ringKey) {
      const ringEl = document.getElementById(ringId);
      let isDragging = false;
      let startAngle = 0;
      let initialRotation = 0;

      function getAngle(clientX, clientY) {
        const rect = ringEl.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const radians = Math.atan2(clientY - centerY, clientX - centerX);
        let degrees = radians * (180 / Math.PI);
        return degrees < 0 ? degrees + 360 : degrees;
      }

      function onStart(e) {
        if (isLockedForAnimation || unlockedTiles.every(t => t === true)) return;
        isDragging = true;
        ringEl.classList.add('dragging');
        
        if (pauseTimer) clearTimeout(pauseTimer);

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        startAngle = getAngle(clientX, clientY);
        initialRotation = ringsState[ringKey];
        e.preventDefault();
      }

      function onMove(e) {
        if (!isDragging || isLockedForAnimation) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const currentAngle = getAngle(clientX, clientY);
        let delta = currentAngle - startAngle;

        let newRotation = normalizeAngle(initialRotation + delta);

        ringsState[ringKey] = newRotation;
        ringEl.style.transform = `rotate(${newRotation}deg)`;

        scheduleAlignmentCheck();
      }

      function onEnd() {
        if (!isDragging) return;
        isDragging = false;
        ringEl.classList.remove('dragging');

        saveProgress();
        scheduleAlignmentCheck();
      }

      ringEl.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);

      ringEl.addEventListener('touchstart', onStart, { passive: false });
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onEnd);
    }

    function triggerUnlockSequence(comboIdx, snapAngles) {
      isLockedForAnimation = true;

      const associatedTiles = getTilesForCombo(comboIdx);
      associatedTiles.forEach(tIdx => {
        unlockedTiles[tIdx] = true;
      });

      ringsState = snapAngles;
      document.getElementById('ring-outer').style.transform = `rotate(${ringsState.outer}deg)`;
      document.getElementById('ring-middle').style.transform = `rotate(${ringsState.middle}deg)`;
      document.getElementById('ring-inner').style.transform = `rotate(${ringsState.inner}deg)`;

      document.querySelectorAll('.wheel-ring').forEach(r => r.style.borderColor = '#00ff88');

      const feedbackEl = document.getElementById('symbol-feedback');
      feedbackEl.textContent = symbolDescriptions[comboIdx];
      feedbackEl.classList.add('show');

      associatedTiles.forEach(tIdx => {
        const tileEl = document.getElementById(`tile-${tIdx}`);
        if (tileEl) {
          tileEl.classList.add('unlocked', 'flash-unlock');
        }
      });

      const totalUnlocked = unlockedTiles.filter(Boolean).length;
      document.getElementById('current-stage').textContent = totalUnlocked;
      saveProgress();

      setTimeout(() => {
        document.getElementById('ring-outer').style.borderColor = '#333333';
        document.getElementById('ring-middle').style.borderColor = '#555555';
        document.getElementById('ring-inner').style.borderColor = '#888888';
        
        feedbackEl.classList.remove('show');
        associatedTiles.forEach(tIdx => {
          const tileEl = document.getElementById(`tile-${tIdx}`);
          if (tileEl) tileEl.classList.remove('flash-unlock');
        });

        checkCompletionState();

        isLockedForAnimation = false;
      }, 2000);
    }

    setupRingRotation('ring-outer', 'outer');
    setupRingRotation('ring-middle', 'middle');
    setupRingRotation('ring-inner', 'inner');

    loadProgress();
  </script>

</body>
</html>
